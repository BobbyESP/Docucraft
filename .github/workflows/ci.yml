name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  # The release workflow runs these checks before it builds.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request replaces its run. Runs on main are left to finish, so every commit
# has a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Only main writes the Gradle cache: a pull request reads the cache of its base branch and
  # cannot fill the repository's quota, or the cache others read, with its own.
  GRADLE_CACHE_READ_ONLY: ${{ github.event_name != 'push' }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build
        with:
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}

      - name: Check formatting
        run: ./gradlew spotlessCheck

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build
        with:
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}

      # --continue: one module's failure does not hide another's. Instrumented tests need a
      # device and are not run here.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :scanner-api:test :document-content-api:test --continue

      - name: Upload the test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  # Reported, but not required: lint fails today on NewApi (BlurHalo.kt calls
  # RuntimeShader.setFloatUniform, API 33, behind a check lint does not see). Once that is fixed,
  # add it to the `ci` job's needs and drop continue-on-error.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build
        with:
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}

      - name: Lint
        run: ./gradlew :app:lintDebug --continue

      - name: Upload the lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*'
          retention-days: 7

  build:
    name: Debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build
        with:
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: docucraft-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # The one check to require in branch protection: it stays the same when jobs are added or
  # renamed, and it fails when a job it waits for failed, was cancelled or was skipped.
  ci:
    name: CI
    if: ${{ always() }}
    needs: [format, test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check that every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
